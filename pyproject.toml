[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citlali-desktop-pet"
version = "1.4.0"
description = "A local Windows desktop pet with transparent animation and voice interactions"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.gui-scripts]
citlali-pet = "citlali_pet.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
